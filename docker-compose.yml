services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - leaderboard-data:/app/server/data
    expose:
      - "3001"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  leaderboard-data:
  caddy-data:
  caddy-config:
